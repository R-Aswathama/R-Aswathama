  <rect width="640" height="280" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="278" rx="15" fill="none" stroke="#1E293B"/>
  <rect x="0" y="0" width="6" height="280" fill="url(#edge)"/>
