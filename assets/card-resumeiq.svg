<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="t d">
  <title id="t">TryResumeIQ</title>
  <desc id="d">AI platform that compares resumes to job descriptions and surfaces gaps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120E22"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="278" rx="15" fill="none" stroke="#1E293B"/>
  <rect x="0" y="0" width="6" height="280" fill="url(#edge)"/>
  <text x="36" y="52" fill="#C4B5FD" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.4" font-weight="600">02  ·  FEATURED</text>
  <text x="36" y="118" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600">TryResumeIQ</text>
  <text x="36" y="184" fill="#94A3B8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Match a resume to the role. Show the gap. Improve the draft.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="36" y="210" width="72" height="28" rx="14" fill="#1A1630" stroke="#3F3560"/>
    <text x="72" y="229" text-anchor="middle" fill="#EDE9FE">Analyze</text>
    <rect x="118" y="210" width="78" height="28" rx="14" fill="#1A1630" stroke="#3F3560"/>
    <text x="157" y="229" text-anchor="middle" fill="#EDE9FE">Compare</text>
    <rect x="206" y="210" width="78" height="28" rx="14" fill="#1A1630" stroke="#3F3560"/>
    <text x="245" y="229" text-anchor="middle" fill="#EDE9FE">Rewrite</text>
  </g>
  <text x="560" y="232" text-anchor="end" fill="#C4B5FD" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">tryresumeiq.com</text>
</svg>
